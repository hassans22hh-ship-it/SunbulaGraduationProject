# ═══════════════════════════════════════════════════════════════
# Sunbula — Docker Compose (Local Development + Production-like)
# ═══════════════════════════════════════════════════════════════
# Usage:
#   cp .env.example .env     # fill in your secrets
#   docker compose up -d     # start everything
#   docker compose logs -f   # watch logs
#   docker compose down      # stop
#   docker compose down -v   # stop + delete DB data

services:
  # ─────────────────────────────────────────────
  # SQL Server 2022 — Database
  # ─────────────────────────────────────────────
  sunbula-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sunbula-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-YourStrong@Password123}
      - MSSQL_PID=Express   # Free edition
    ports:
      - "1433:1433"          # Expose to host for SSMS/Azure Data Studio
    volumes:
      - sqldata:/var/opt/mssql    # Persist DB data across restarts
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s     # SQL Server needs time to initialize
    networks:
      - sunbula-net

  # ─────────────────────────────────────────────
  # Sunbula API — .NET 10
  # ─────────────────────────────────────────────
  sunbula-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sunbula-api
    ports:
      - "5000:8080"          # Host:Container — access at http://localhost:5000
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__SunbulaDb=Server=sunbula-db,1433;Database=Sunbula;User Id=sa;Password=${DB_PASSWORD:-YourStrong@Password123};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True
      - Jwt__SecretKey=${JWT_SECRET}
      - Jwt__Issuer=http://localhost:5000
      - Jwt__Audience=SunbulaClient
      - EmailSettings__Email=${EMAIL_ADDRESS}
      - EmailSettings__Password=${EMAIL_PASSWORD}
      - EmailSettings__Host=smtp.gmail.com
      - EmailSettings__Port=587
    depends_on:
      sunbula-db:
        condition: service_healthy   # Wait for DB to be ready
    networks:
      - sunbula-net

# ─────────────────────────────────────────────
# Named volumes — persist across restarts
# ─────────────────────────────────────────────
volumes:
  sqldata:
    driver: local

# ─────────────────────────────────────────────
# Network — containers communicate by name
# ─────────────────────────────────────────────
networks:
  sunbula-net:
    driver: bridge
