# ═══════════════════════════════════════════════════════════════
# CI — Continuous Integration
# Runs on every push and pull request to any branch.
# Builds the project and runs tests.
# ═══════════════════════════════════════════════════════════════

name: CI — Build & Test

on:
  push:
    branches: ["*"]           # Every branch
  pull_request:
    branches: [master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup .NET 10 SDK ──
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # ── 3. Cache NuGet packages ──
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # ── 4. Restore dependencies ──
      - name: Restore NuGet packages
        run: dotnet restore SunbulaGraduationProject.slnx

      # ── 5. Build ──
      - name: Build solution
        run: dotnet build SunbulaGraduationProject.slnx -c Release --no-restore

      # ── 6. Run integration tests (Testcontainers.MsSql) ──
      - name: Run Integration Tests
        run: dotnet test Sunbula.IntegrationTests/Sunbula.IntegrationTests.csproj -c Release --no-build --verbosity normal
