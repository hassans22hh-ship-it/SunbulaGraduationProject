# ═══════════════════════════════════════════════════════════════
# CD — Continuous Deployment to MonsterASP via FTP
# Runs only when code is pushed to the master branch.
# ═══════════════════════════════════════════════════════════════
#
# REQUIRED GITHUB SECRETS (set in repo Settings → Secrets → Actions):
#   FTP_SERVER        — MonsterASP FTP hostname (e.g., ftp.monster-asp.net)
#   FTP_USERNAME      — FTP login username
#   FTP_PASSWORD      — FTP login password
#   DB_CONNECTION_STRING — Production SQL Server connection string
#   JWT_SECRET_KEY    — JWT signing key
#   EMAIL_APP_PASSWORD — Gmail app password
#   EMAIL_ADDRESS     — Gmail address for sending emails

name: CD — Deploy to MonsterASP

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup .NET 10 SDK ──
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # ── 3. Cache NuGet packages ──
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # ── 4. Restore + Build ──
      - name: Restore NuGet packages
        run: dotnet restore SunbulaGraduationProject.slnx

      - name: Build solution
        run: dotnet build SunbulaGraduationProject.slnx -c Release --no-restore

      # ── 5. Publish ──
      - name: Publish application
        run: dotnet publish Sunbula/Sunbula.csproj -c Release -o ./publish --no-build

      # ── 6. Create production appsettings ──
      #    Injects secrets as environment-specific config
      - name: Create appsettings.Production.json
        run: |
          cat > ./publish/appsettings.Production.json << 'SETTINGS'
          {
            "ConnectionStrings": {
              "SunbulaDb": "${{ secrets.DB_CONNECTION_STRING }}"
            },
            "Jwt": {
              "SecretKey": "${{ secrets.JWT_SECRET_KEY }}",
              "Issuer": "https://localhost:7217;http://localhost:5142;https://sunbula.runasp.net/",
              "Audience": "SunbulaClient",
              "ExpiryMinutes": 60,
              "RefreshTokenExpiryDays": 7
            },
            "EmailSettings": {
              "Email": "${{ secrets.EMAIL_ADDRESS }}",
              "Password": "${{ secrets.EMAIL_APP_PASSWORD }}",
              "Host": "smtp.gmail.com",
              "Port": 587
            },
            "Logging":mfsuhnduoraezghh {
              "LogLevel": {
                "Default": "Warning",
                "Microsoft.AspNetCore": "Warning"
              }
            }
          }
          SETTINGS

      # ── 7. Safely take IIS app offline to release file locks ──
      - name: Put app offline (release DLL locks)
        run: |
          echo "<html><head><title>Deploying</title></head><body><h2>Updating Sunbula... Please wait 30 seconds.</h2></body></html>" > ./app_offline.htm
          curl --ftp-create-dirs -T ./app_offline.htm -u "${{ secrets.FTP_USERNAME || 'site68347' }}:${{ secrets.FTP_PASSWORD }}" ftp://site68347.siteasp.net/wwwroot/app_offline.htm || true
          sleep 3

      # ── 8. Deploy via FTP ──
      - name: Deploy to MonsterASP via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: site68347.siteasp.net
          username: ${{ secrets.FTP_USERNAME || 'site68347' }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /wwwroot/
          dangerous-clean-slate: false

      # ── 9. Bring app back online ──
      - name: Bring app online (remove app_offline.htm)
        if: always()
        run: |
          curl -u "${{ secrets.FTP_USERNAME || 'site68347' }}:${{ secrets.FTP_PASSWORD }}" -Q "DELE /wwwroot/app_offline.htm" ftp://site68347.siteasp.net/ || true
